<body class="bg-black h-screen"
>
  <div class="flex items-center justify-center min-h-screen bg-no-repeat bg-cover "style="background-image: url('undraw_mobile-content_yz21.svg')">
<div class="bg-white rounded-lg p-8 w-full max-w-lg">
  <h1 class="text-3xl font-bold text-center mb-6"> Calculator</h1>
  <div class=" rounded-lg p-6">
    <div class="mb-4 flex gap-2">
      <input type="text" id="input" placeholder="Enter calculation" class="rounded w-full py-3 px-4 text-gray-700 border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <button class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded" onclick="clearInput()">C</button>
    </div>
    <div class="grid grid-cols-4 gap-2">
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('1')">1</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('2')">2</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('3')">3</button>
      <button class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded" onclick="add('+')">+</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('4')">4</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('5')">5</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('6')">6</button>
      <button class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded" onclick="add('-')">-</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('7')">7</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('8')">8</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('9')">9</button>
      <button class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded" onclick="calculate()">=</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('0')">0</button>
      <button class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded" onclick="add('.')">.</button>
      <button class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded" onclick="add('*')">*</button>
      <button class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded" onclick="add('/')">/</button>
    </div>
  </div>
</div>

  <script>
    function add(value) {
      document.getElementById('input').value += value;
    }

    function calculate() {
      try {
        document.getElementById('input').value = eval(document.getElementById('input').value);
      } catch (e) {
        document.getElementById('input').value = 'Error';
      }
    }

    function clearInput() {
      document.getElementById('input').value = '';
    }
  </script>
